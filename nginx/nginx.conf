# Единая точка входа. Видео мимо Python: Nginx сам ходит в MinIO по короткоживущим presigned-URL,
# которые ему выдаёт API после проверки прав (auth_request).
events {}
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=30s ipv6=off;   # Docker DNS (нужен для proxy_pass с переменной)
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json;

  map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; }

  server {
    listen 80;
    client_max_body_size 1m;          # API принимает только JSON; видео летит напрямую в /s3/
    set $minio_host "minio:9000";

    # add_header в location ОТМЕНЯЕТ унаследованные заголовки сервера, поэтому везде include
    include /etc/nginx/snippets/security.conf;
    include /etc/nginx/snippets/csp.conf;

    # ---- API и Swagger ----
    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # перезаписываем, а не дополняем: клиент не подделает IP
      proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location = /docs {  # Swagger UI тянет скрипты с CDN, поэтому без строгого CSP
      include /etc/nginx/snippets/security.conf;
      proxy_pass http://api:8000;
    }
    location = /openapi.json { proxy_pass http://api:8000; }

    # ---- Загрузка: браузер PUT-ит части напрямую в MinIO по presigned URL (подпись проверяет MinIO) ----
    location /s3/ {
      client_max_body_size 64m;       # часть = 16 МБ
      proxy_request_buffering off;
      limit_except PUT { deny all; }
      rewrite ^/s3/(.*)$ /$1 break;
      proxy_pass http://minio:9000;
      proxy_set_header Host $minio_host;
    }

    # ---- Раздача: только HLS и превью, только после проверки прав в API ----
    location = /_media_auth {
      internal;
      proxy_pass http://api:8000/api/media/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }
    location ~ "^/media/[0-9a-f-]{36}/(thumb\.jpg|hls/.+)$" {
      limit_except GET HEAD { deny all; }
      auth_request /_media_auth;
      auth_request_set $s3url  $upstream_http_x_presigned_url;
      auth_request_set $s3host $upstream_http_x_presigned_host;
      proxy_pass $s3url;              # URL уже содержит путь и подпись
      proxy_set_header Host $s3host;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-id-2;
      add_header Cache-Control "private, max-age=60" always;
      include /etc/nginx/snippets/security.conf;
      include /etc/nginx/snippets/csp.conf;
    }
    location /media/ { return 404; }  # source и всё остальное наружу не отдаём

    # ---- Фронт ----
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      expires -1;   # Cache-Control: no-cache, не затирая заголовки безопасности
    }
  }
}
