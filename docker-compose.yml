x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  minio:
    <<: *restart
    image: minio/minio:latest
    command: server /data
    env_file: .env
    volumes: [miniodata:/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc ready local || curl -fs http://localhost:9000/minio/health/live",
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  minio-init:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      (mc mb -p local/$$S3_BUCKET) && mc anonymous set none local/$$S3_BUCKET"

  api:
    <<: *restart
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *restart
    build: ./backend
    env_file: .env
    command: celery -A app.worker.celery_app worker -B -l info -c 2
    depends_on:
      api: { condition: service_healthy }

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
